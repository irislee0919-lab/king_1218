<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的家庭成員名冊</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🏠 全家名冊</h1>
      <p>金家家庭成員詳細資料卡片</p>
    </header>

    <main class="card-container">
      <!-- 爸爸 -->
      <article class="family-card">
        <div class="avatar">👨</div>
        <span class="role-badge role-parent">爹爹</span>
        <h2 class="member-name">爸爸</h2>
        <ul class="info-list">
          <li>🎂 <strong>生日：</strong>1965-06-18</li>
          <li>🎯 <strong>興趣：</strong>賺錢、喝咖啡</li>
          <img class="avatar-img" src="images/dad.jpg" alt="爸爸的大頭照" />
        </ul>
      </article>

      <!-- 媽媽 -->
      <article class="family-card">
        <div class="avatar">👩</div>
        <span class="role-badge role-parent">媽咪</span>
        <h2 class="member-name">媽媽</h2>
        <ul class="info-list">
          <li>🎂 <strong>生日：</strong>1981-09-19</li>
          <li>🎯 <strong>興趣：</strong>賺很多錢、看劇</li>
          <img class="avatar-img" src="images/mom.jpg" alt="媽媽的大頭照" />
        </ul>
      </article>

      <!-- 女兒（金智宣） -->
      <article class="family-card">
        <div class="avatar">👧</div>
        <span class="role-badge role-child">女兒</span>
        <h2 class="member-name">金智宣</h2>
        <ul class="info-list">
          <li>🎂 <strong>生日：</strong>2011-08-17</li>
          <li>🎯 <strong>興趣：</strong>畫圖、打電動</li>
          <img
            class="avatar-img"
            src="images/daughter.jpg"
            alt="女兒的大頭照"
          />
        </ul>
      </article>

      <!-- 兒子（金智恩） -->
      <article class="family-card">
        <div class="avatar">👦</div>
        <span class="role-badge role-child">兒子</span>
        <h2 class="member-name">金智恩</h2>
        <ul class="info-list">
          <li>🎂 <strong>生日：</strong>2014-06-23</li>
          <li>🎯 <strong>興趣：</strong>玩樂高、貓咪大作戰、戰鬥陀螺</li>
          <img class="avatar-img" src="images/son.jpg" alt="兒子的大頭照" />
        </ul>
      </article>
    </main>

    <!-- JS 會把產生的卡片放進這個容器裡 -->
    <main id="family-list" class="card-container"></main>

    <script src="script.js"></script>
  </body>
</html>
